name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Secret scan
        run: npm run scan
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test (mocks only, no Codex)
        run: npm test
        env:
          SULTI_CI: "1"
